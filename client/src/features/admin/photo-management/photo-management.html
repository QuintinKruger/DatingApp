<div class='grid grid-cols-6 gap-4'>
    @for (photo of paginatedUnapprovedPhotos()?.items; track photo.id) {
    <div>
        <img src='{{photo.url}}' class='img-thumbnail p-1' alt='user image'>
        <div class='flex w-full gap-3'>
            <button class='btn btn-success flex-grow' (click)='approvePhoto(photo)'>Approve</button>
            <button class='btn btn-error flex-grow' (click)='rejectPhoto(photo)'>Reject</button>
        </div>
    </div>
    }
</div>
